name: Godot toolkit install
author: Pawel Lampe
description: Install the Godot toolkit from the repository source
branding:
  icon: activity
  color: blue

runs:
  using: composite
  steps:
    - name: Checkout GDToolkit source
      uses: actions/checkout@v7
      with:
        repository: MariaElysse/godot-gdscript-toolkit
        path: gdtoolkit-source

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
        cache: "pip"

    - name: Upgrade setuptools
      run: pip install --upgrade setuptools
      shell: bash
      working-directory: gdtoolkit-source

    - name: Install GDToolkit
      run: pip install .
      shell: bash
      working-directory: gdtoolkit-source
